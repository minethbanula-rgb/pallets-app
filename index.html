<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8e5dc"><title>pallets.app — colors from moments</title><style>*{box-sizing:border-box}body{margin:0;background:#171715;color:#222;font-family:Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:490px;margin:auto;background:#e8e5dc;min-height:100dvh;padding:36px 25px 32px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;font-size:15px}.brand{font-weight:650;letter-spacing:-.8px}.sub{color:#88877f;font-size:13px}.hero{margin:58px 0 22px;font-size:clamp(48px,13vw,72px);line-height:.99;letter-spacing:-4px;font-weight:500}.muted{color:#87857f}.intro{font-size:15px;line-height:1.5;max-width:260px}.upload{margin-top:35px;border:1px solid #b7b4aa;background:transparent;padding:19px 18px;text-align:left;display:flex;align-items:center;justify-content:space-between;width:100%;font-size:17px}.upload:hover{background:#dedbd2}.preview{margin-top:28px;display:none}.photo{width:100%;height:360px;object-fit:cover;display:block}.palette{display:flex;flex-direction:column;gap:3px;height:148px;margin-top:12px}.palrow{display:flex;gap:3px;flex:1}.swatch{min-width:0;position:relative;cursor:pointer}.swatch span{display:none;position:absolute;bottom:7px;left:7px;font-size:10px;background:#ffffffb9;padding:3px}.swatch:hover span{display:block}.controls{display:flex;gap:9px;margin-top:17px;flex-wrap:wrap}.pill{border:1px solid #b8b5ac;background:transparent;padding:12px 14px;border-radius:30px;font-size:13px}.pill.primary{background:#242422;color:#fff;border-color:#242422}.footer{margin-top:auto;padding-top:50px;display:flex;justify-content:space-between;color:#8c8980;font-size:12px}.error{font-size:13px;color:#9b3d32;margin-top:12px}.hidden{display:none}@media(min-width:700px){.app{margin:30px auto;min-height:850px;border-radius:25px;box-shadow:0 30px 100px #0006}.hero{font-size:70px}}</style></head><body><main class="app"><header class="top"><div class="brand">pallets.app<span style="color:#96948b">®</span></div><div class="sub">A study in color. <span id="count">001</span></div></header><section id="landing"><h1 class="hero">Find colors<br>in <span class="muted">everyday.</span></h1><p class="intro">A little collection of colors hiding in the moments you capture.</p><button class="upload" id="choose">Choose a photograph <span>↗</span></button><button class="upload" id="camera" style="margin-top:9px">Take a photograph <span>↗</span></button></section><section class="preview" id="preview"><div class="top" style="margin-bottom:16px"><span>YOUR PALETTE</span><span class="sub" id="paletteCount">09 COLORS</span></div><img class="photo" id="photo" alt="Selected photograph"><div class="palette" id="palette"></div><div class="controls"><button class="pill" id="regenerate">↻ Regenerate</button><button class="pill" id="hex">Show HEX</button><button class="pill primary" id="export">↓ Export story</button><button class="pill" id="share">↗ Share</button><button class="pill" id="again">New photo</button></div><div id="message" class="error"></div></section><footer class="footer"><span>Collect what you see.</span><span>© pallets.app 2026</span></footer><input type="file" accept="image/*" id="file" class="hidden"><input type="file" accept="image/*" capture="environment" id="capture" class="hidden"></main><script>const $=id=>document.getElementById(id);let img=null,colors=[],weights=[],showHex=false,seed=0; $('choose').onclick=()=>$('file').click();$('camera').onclick=()=>$('capture').click();$('again').onclick=()=>{$('preview').style.display='none';$('landing').style.display='block';$('file').value='';$('capture').value=''};['file','capture'].forEach(id=>$(id).onchange=async e=>{const f=e.target.files?.[0];if(!f)return;const url=URL.createObjectURL(f);const image=new Image();image.onload=()=>{if(img?.src.startsWith('blob:'))URL.revokeObjectURL(img.src);img=image;$('photo').src=url;$('landing').style.display='none';$('preview').style.display='block';extract();};image.onerror=()=>{$('message').textContent='Unable to open this image.'};image.src=url});function extract(){if(!img)return;const c=document.createElement('canvas');const s=120;c.width=s;c.height=Math.max(1,Math.round(s*img.naturalHeight/img.naturalWidth));const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,c.width,c.height);const data=ctx.getImageData(0,0,c.width,c.height).data;let pixels=[];for(let i=0;i<data.length;i+=16){if(data[i+3]<200)continue;pixels.push([data[i],data[i+1],data[i+2]])}if(!pixels.length)return;const k=9;let centers=Array.from({length:k},(_,j)=>pixels[Math.floor(((j+.5)/k*pixels.length+seed*137)%pixels.length)].slice());let groups=new Array(k).fill(0);for(let iter=0;iter<14;iter++){const sums=Array.from({length:k},()=>[0,0,0,0]);for(const p of pixels){let best=0,dist=Infinity;centers.forEach((v,j)=>{let d=(p[0]-v[0])**2+(p[1]-v[1])**2+(p[2]-v[2])**2;if(d<dist){dist=d;best=j}});sums[best][0]+=p[0];sums[best][1]+=p[1];sums[best][2]+=p[2];sums[best][3]++}centers=centers.map((v,j)=>sums[j][3]?sums[j].slice(0,3).map(x=>Math.round(x/sums[j][3])):v);groups=sums.map(x=>x[3])}let order=centers.map((c,i)=>({c,n:groups[i]})).sort((a,b)=>b.n-a.n);colors=order.map(x=>'#'+x.c.map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase());weights=order.map(x=>x.n);render()}function render(){const el=$('palette');el.innerHTML='';let total=weights.reduce((a,b)=>a+b,0)||1;for(let r=0;r<3;r++){const row=document.createElement('div');row.className='palrow';const subset=colors.slice(r*3,r*3+3);subset.forEach((color,j)=>{const i=r*3+j;const block=document.createElement('div');block.className='swatch';block.style.background=color;block.style.flex=String(Math.max(0.08,weights[i]/total));block.title=color+' — tap to copy';const label=document.createElement('span');label.textContent=color;label.style.display=showHex?'block':'';block.appendChild(label);block.onclick=()=>{navigator.clipboard?.writeText(color);$('message').textContent='Copied '+color};row.appendChild(block)});el.appendChild(row)}$('paletteCount').textContent=colors.length+' COLORS'}$('regenerate').onclick=()=>{seed++;extract()};$('hex').onclick=()=>{showHex=!showHex;$('hex').textContent=showHex?'Hide HEX':'Show HEX';render()};function story(){const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');x.fillStyle='#e8e5dc';x.fillRect(0,0,1080,1920);x.fillStyle='#222';x.font='500 37px Arial';x.fillText('pallets.app',90,115);const bx=90,by=175,bw=900,bh=1220;const scale=Math.max(bw/img.naturalWidth,bh/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale;x.save();x.beginPath();x.rect(bx,by,bw,bh);x.clip();x.drawImage(img,bx+(bw-w)/2,by+(bh-h)/2,w,h);x.restore();const py=1450,ph=270,g=5;let maxW=weights.reduce((a,b)=>a+b,0)||1;for(let r=0;r<3;r++){let part=weights.slice(r*3,r*3+3),sum=part.reduce((a,b)=>a+b,0)||1,off=bx;part.forEach((v,j)=>{const i=r*3+j;let cw=(bw-g*2)*v/sum;x.fillStyle=colors[i];x.fillRect(off,py+r*(ph/3+g),cw,ph/3);off+=cw+g})}x.fillStyle='#77746e';x.font='28px Arial';x.fillText('COLORS FROM EVERYDAY MOMENTS',90,1810);return c}function download(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pallets-story.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}$('export').onclick=()=>{if(!img)return;story().toBlob(b=>b&&download(b),'image/png')};$('share').onclick=()=>{if(!img)return;story().toBlob(async b=>{if(!b)return;const f=new File([b],'pallets-story.png',{type:'image/png'});try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f],title:'My palette — pallets.app'})}else{download(b);$('message').textContent='Image downloaded. Upload it to Instagram Stories.'}}catch(e){if(e.name!=='AbortError')$('message').textContent='Sharing unavailable. Use Export story instead.'}},'image/png')};</script></body></html>
