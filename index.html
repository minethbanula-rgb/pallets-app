function storyLayout(imageWidth,imageHeight){const width=940,maxHeight=showHex?1180:1320,scale=Math.min(width/imageWidth,maxHeight/imageHeight),w=imageWidth*scale,h=imageHeight*scale;const paletteHeight=h<800?300:220,gap=36,header=96,legendHeight=showHex?Math.ceil(colors.length/3)*38+32:0,total=header+h+gap+paletteHeight+legendHeight,top=(1800-total)/2;return {photoX:(1080-w)/2,photoY:top+header,photoWidth:w,photoHeight:h,brandY:top+42,paletteX:70,paletteY:top+header+h+gap,paletteWidth:940,paletteHeight,legendY:top+header+h+gap+paletteHeight+40}}
function story(){const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d'),layout=storyLayout(img.naturalWidth,img.naturalHeight);x.fillStyle='#e9e6dd';x.fillRect(0,0,c.width,c.height);x.fillStyle='#41433f';x.textAlign='center';drawLogo(x,540,layout.brandY-34,240);
x.drawImage(img,layout.photoX,layout.photoY,layout.photoWidth,layout.photoHeight);
paletteRects().forEach(r=>{x.fillStyle=colors[r.i];x.fillRect(layout.paletteX+r.x*layout.paletteWidth,layout.paletteY+r.y*layout.paletteHeight,r.w*layout.paletteWidth,r.h*layout.paletteHeight)});
if(showHex){x.textAlign='left';x.font='22px Arial';colors.forEach((color,i)=>{const col=i%3,row=Math.floor(i/3),left=70+col*320,top=layout.legendY+row*38;x.fillStyle=color;x.fillRect(left,top-18,20,20);x.fillStyle='#41433f';x.fillText(color,left+32,top)})}
x.textAlign='center';x.fillStyle='#858278';x.font='19px Arial';drawLogo(x,485,1804,115);x.fillText('· beta testing',610,1820);x.fillText('Your photos are not uploaded or stored.',540,1850);x.fillText('Open source · MIT License',540,1880);return c}
function download(blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pallets-story.png';a.style.display='none';document.body.appendChild(a);a.click();a.remove();$('message').textContent='Download requested: pallets-story.png. Check your Downloads folder.';setTimeout(()=>URL.revokeObjectURL(url),60000)}
function exportBlob(callback){if(!img){$('message').textContent='Choose a photograph first.';return}try{const encoded=story().toDataURL('image/png').split(',')[1],binary=atob(encoded),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);callback(new Blob([bytes],{type:'image/png'}))}catch(e){$('message').textContent='Could not export this image. Please try again.'}}
$('export').onclick=()=>exportBlob(download);
$('share').onclick=()=>exportBlob(b=>{const f=new File([b],'pallets-story.png',{type:'image/png'});if(!navigator.share||!navigator.canShare?.({files:[f]})){download(b);$('message').textContent='Image downloaded. Open Instagram → Story and select it from your photos or files.';return}
$('message').textContent='Choose Instagram, then Stories, if available in your share sheet.';
navigator.share({files:[f]}).catch(e=>{if(e.name!=='AbortError')$('message').textContent='Sharing unavailable. Download the image, then add it in Instagram Stories.'})});
