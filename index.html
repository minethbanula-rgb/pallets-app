<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9e6dd"><title>pallets.app</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e6dd;color:#292b29;font-family:Arial,Helvetica,sans-serif}.app{width:min(100%,466px);margin:auto;padding:68px 28px 70px;min-height:100dvh}.brand{text-align:center;font-size:19px;letter-spacing:-.6px;margin-bottom:17px}.brand strong{font-style:italic;font-weight:750}.content{width:100%;max-width:334px;margin:auto}.photo{display:block;width:100%;height:auto;object-fit:contain;border-radius:8px}.palette{display:flex;gap:4px;width:78%;height:36px;margin:22px auto 0}.swatch{border:0;border-radius:6px;min-width:0;padding:0;cursor:pointer}.swatch:focus-visible,.tool:focus-visible,.upload:focus-visible{outline:2px solid #676656;outline-offset:4px}.controls{display:flex;justify-content:center;gap:7px;margin-top:61px}.tool{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:12px;background:#e1ded2;color:#191a17;cursor:pointer}.tool svg{width:23px;height:23px}.tool.primary{background:#0d0d06;color:#efede5}.tool:hover{filter:brightness(.95)}.codes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px;font-size:11px}.codes button{background:transparent;border:0;color:inherit;font:inherit;cursor:pointer}.message{text-align:center;font-size:12px;line-height:1.5;min-height:18px;margin:18px 0 0;color:#68675f}.landing{padding:62px 0 0;text-align:center}.landing h1{font-size:42px;letter-spacing:-2px;font-weight:500;line-height:1.08}.landing p{font-size:14px;color:#77766c;line-height:1.6}.upload{border:1px dashed #b9b6aa;border-radius:12px;padding:44px 15px;width:100%;background:transparent;color:inherit;cursor:pointer}.upload span{display:block;font-size:12px;color:#77766c;margin-top:12px}[hidden]{display:none!important}
@media(max-width:360px){.app{padding:42px 20px}.controls{margin-top:40px}}
</style></head><body><main class="app"><header class="brand"><strong>pallets</strong>.app</header><div class="content">
<section id="landing" class="landing"><h1>Colors from<br>everyday moments.</h1><p>A little collection of colors hiding in your photographs.</p><button id="choose" class="upload">＋ Choose a photograph<span>Portrait, landscape, square — the whole image.</span></button></section>
<section id="preview" hidden><img id="photo" class="photo" alt="Your complete uploaded photograph"><div id="palette" class="palette" aria-label="Extracted colors"></div><div id="codes" class="codes" hidden></div></section>
<div class="controls"><button class="tool " id="camera" aria-label="Add a new photo" title="Add a new photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5h-4L8 8H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/><circle cx="11" cy="13" r="3"/><path d="M19 3v6m-3-3h6"/></svg></button><button class="tool " id="hex" aria-label="Show HEX codes" title="Show HEX codes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 4-4 16M18 4l-4 16M4 9h17M3 15h17"/></svg></button><button class="tool primary" id="export" aria-label="Download palette" title="Download palette"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg></button><button class="tool " id="share" aria-label="Share palette" title="Share palette"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 4 7 6-7 6v-4C8 12 5 15 3 20c0-9 4-12 11-12Z"/></svg></button></div><p id="message" class="message" role="status" aria-live="polite"></p>
<input id="file" type="file" accept="image/*" hidden></div></main><script>
const $=id=>document.getElementById(id);let img=null,colors=[],weights=[],showHex=false,seed=0,loadId=0;
$('choose').onclick=$('camera').onclick=()=>{$('file').value='';$('file').click()};
$('file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const request=++loadId,url=URL.createObjectURL(f),image=new Image();$('message').textContent='Opening photograph…';image.onload=()=>{if(request!==loadId){URL.revokeObjectURL(url);return}if(img)URL.revokeObjectURL(img.src);img=image;$('photo').src=url;$('landing').hidden=true;$('preview').hidden=false;extract();$('message').textContent=colors.length?'':'No visible colors found in this image.'};image.onerror=()=>{URL.revokeObjectURL(url);if(request===loadId)$('message').textContent='Unable to open this image. Try a JPEG, PNG, or WebP.'};image.src=url};
function extract(){if(!img)return;const c=document.createElement('canvas');const scale=Math.min(1,180/img.naturalWidth,180/img.naturalHeight);c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,c.width,c.height);const data=ctx.getImageData(0,0,c.width,c.height).data;let pixels=[];for(let i=0;i<data.length;i+=4){if(data[i+3]<200)continue;pixels.push([data[i],data[i+1],data[i+2]])}if(!pixels.length){colors=[];weights=[];render();return;}const k=6;let centers=[pixels[0].slice()];while(centers.length<k){let candidate=null,farthest=0;for(const p of pixels){const distance=Math.min(...centers.map(v=>(p[0]-v[0])**2+(p[1]-v[1])**2+(p[2]-v[2])**2));if(distance>farthest){farthest=distance;candidate=p}}if(!candidate)break;centers.push(candidate.slice())}let groups=new Array(k).fill(0);for(let iter=0;iter<14;iter++){const sums=Array.from({length:k},()=>[0,0,0,0]);for(const p of pixels){let best=0,dist=Infinity;centers.forEach((v,j)=>{let d=(p[0]-v[0])**2+(p[1]-v[1])**2+(p[2]-v[2])**2;if(d<dist){dist=d;best=j}});sums[best][0]+=p[0];sums[best][1]+=p[1];sums[best][2]+=p[2];sums[best][3]++}centers=centers.map((v,j)=>sums[j][3]?sums[j].slice(0,3).map(x=>Math.round(x/sums[j][3])):v);groups=sums.map(x=>x[3])}groups=centers.map(()=>0);for(const p of pixels){let best=0,dist=Infinity;centers.forEach((v,j)=>{const d=(p[0]-v[0])**2+(p[1]-v[1])**2+(p[2]-v[2])**2;if(d<dist){dist=d;best=j}});groups[best]++}let order=centers.map((c,i)=>({c,n:groups[i]})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);colors=order.map(x=>'#'+x.c.map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase());weights=order.map(x=>x.n);render()}
function render(){const el=$('palette'),codes=$('codes');el.replaceChildren();codes.replaceChildren();colors.forEach((color,i)=>{const b=document.createElement('button');b.className='swatch';b.style.background=color;b.style.flex=String(weights[i])+' 1 0px';const percentage=(100*weights[i]/weights.reduce((a,b)=>a+b,0)).toFixed(1)+'%';b.title=color+' · '+percentage;b.setAttribute('aria-label','Copy '+color+', '+percentage+' of image');b.onclick=()=>copy(color);el.appendChild(b);const label=document.createElement('button');label.textContent=color+' · '+percentage;label.onclick=()=>copy(color);codes.appendChild(label)});codes.hidden=!showHex}
async function copy(color){try{await navigator.clipboard.writeText(color);$('message').textContent='Copied '+color}catch{$('message').textContent=color}}
$('hex').onclick=()=>{showHex=!showHex;$('hex').setAttribute('aria-pressed',String(showHex));$('hex').setAttribute('aria-label',showHex?'Hide HEX codes':'Show HEX codes');$('codes').hidden=!showHex};
function story(){const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');x.fillStyle='#e9e6dd';x.fillRect(0,0,c.width,c.height);x.fillStyle='#41433f';x.textAlign='center';x.font='italic bold 45px Arial';x.fillText('pallets.app',540,195);
const scale=Math.min(770/img.naturalWidth,1230/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale;
x.drawImage(img,(1080-w)/2,245,w,h);
const total=weights.reduce((a,b)=>a+b,0)||1,gap=9,width=600,usable=width-gap*(colors.length-1);let left=(1080-width)/2;
colors.forEach((color,i)=>{const sw=usable*weights[i]/total;x.fillStyle=color;x.beginPath();x.roundRect(left,245+h+52,sw,81,Math.min(13,sw/2));x.fill();left+=sw+gap});return c}
function download(blob){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='pallets-story.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportBlob(callback){if(!img){$('message').textContent='Choose a photograph first.';return}story().toBlob(b=>{if(b)callback(b);else $('message').textContent='Could not export this image.'},'image/png')}
$('export').onclick=()=>exportBlob(download);
$('share').onclick=()=>exportBlob(async b=>{const f=new File([b],'pallets-story.png',{type:'image/png'});try{if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:'My palette — pallets.app'});else{download(b);$('message').textContent='Palette downloaded and ready to share.'}}catch(e){if(e.name!=='AbortError')$('message').textContent='Use the download button to save your palette.'}});
</script></body></html>
